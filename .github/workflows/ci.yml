name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aquaguard_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Kanal (channel: stable) yerine SABIT bir surum -- yerel
          # gelistirme ortami Flutter 3.44.4 kullaniyor ve bu projede
          # intl paketi flutter_localizations'in SDK-ici surumune tam
          # eslesmesi gereken bir versiyona sabitlenmis (bkz. pubspec.yaml).
          # "stable" kanali zaman icinde farkli bir Flutter surumune
          # kayabilir ve o surumun beklediği intl versiyonu YEREL ile
          # ESLESMEYEBILIR -- bu, "flutter pub get" asamasinda bagimlilik
          # cozumleme hatasina yol acardi (CI'da tekrarlanan basarisizligin
          # olasi kok nedeni).
          flutter-version: '3.44.4'
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Coverage ozeti (satir bazli, esik DEGIL -- sadece raporlama)
        run: |
          # *.g.dart (drift/build_runner uretimi) HARIC TUTULUR -- elle
          # yazilmayan, kimsenin dogrudan cagirmadigi Companion/toColumns
          # gibi otomatik kod, kapsam olcumunu anlamsizca sulandirirdi.
          awk -F: '
            /^SF:/ { skip = ($0 ~ /\.g\.dart$/) }
            /^LH:/ { if (!skip) hit += $2 }
            /^LF:/ { if (!skip) found += $2 }
            END {
              pct = (found > 0) ? 100*hit/found : 0
              printf "Toplam kapsam (uretilen kod haric): %.1f%% (%d/%d satir)\n", pct, hit, found
            }
          ' coverage/lcov.info
      - run: flutter build web --release

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest

  firmware:
    name: Firmware (arduino-cli derleme, genel ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 cekirdegi ve kutuphaneler
        run: |
          arduino-cli config init
          arduino-cli config set network.connection_timeout 600s
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "PubSubClient" "ArduinoJson" "TinyGSM" "RTClib" "ESP32Servo"
      # Yalnizca DERLEME dogrulamasi (genel esp32:esp32:esp32 karti). Deneyap
      # Kart tanimi ve gercek donanim davranisi burada DOGRULANMAZ.
      - name: Derle
        run: |
          # arduino-cli, klasor adinin .ino adiyla ayni olmasini ister.
          mkdir -p /tmp/aquaguard_main
          cp firmware/*.ino firmware/*.h /tmp/aquaguard_main/
          arduino-cli compile --fqbn esp32:esp32:esp32 /tmp/aquaguard_main
