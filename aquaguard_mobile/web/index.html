<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AquaGuard - Toprak altı damla sulama sistemlerinde tıkanma türünü otonom teşhis eden ve tedavi eden akıllı izleme uygulaması.">
  <meta name="theme-color" content="#0D2137">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AquaGuard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AquaGuard</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Flutter'in engine/JS yuku ilk boyandigi kareye (flutter-first-frame) kadar
    saniyelerce surebilir; o sureye kadar tarayici sadece background_color'i
    (duz gri-beyaz) gosterir -- "bos/cokmus" izlenimi verir. Bunun yerine
    marka rengiyle (teal) tutarli, animasyonlu bir su damlasi gosteriyoruz.
    Flutter, ilk kareyi cizdiginde standart "flutter-first-frame" olayini
    kendisi yayinlar (bkz. https://docs.flutter.dev/platform-integration/web/initialization)
    -- bu olayi dinleyip yukleme ekranini kaldiriyoruz.
  -->
  <style>
    #aq-yukleniyor {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121820;
      z-index: 9999;
    }
    #aq-yukleniyor svg {
      animation: aq-nabiz 1.4s ease-in-out infinite;
    }
    @keyframes aq-nabiz {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.9); }
    }
  </style>
</head>
<body>
  <div id="aq-yukleniyor">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 6C32 6 14 30 14 42a18 18 0 0 0 36 0C50 30 32 6 32 6Z" fill="#00BFA6"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('aq-yukleniyor');
      if (el) el.remove();
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
